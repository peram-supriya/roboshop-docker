services:
  catalogue:
    build:
      context: ./catalogue # it moves to catalogue directory
    image: perampriya/catalogue:1.0.0 # docker build -t perampriya/catalogue:1.0.0 
    container_name: catalogue

  mongodb:
    build:
      context: ./mongodb # it moves to mongodb directory
    image: perampriya/mongodb:1.0.0 # docker build -t perampriya/mongodb:1.0.0 
    container_name: mongodb

networks:
  default:
    driver: bridge
    name: roboshop
    external: false # if true, you need to create network manually.